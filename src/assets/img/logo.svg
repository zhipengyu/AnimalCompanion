<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景圆形 -->
  <circle cx="100" cy="100" r="95" fill="#FF6B9D" opacity="0.1"/>

  <!-- 主圆形背景 -->
  <circle cx="100" cy="100" r="85" fill="url(#gradient1)"/>

  <!-- 渐变定义 -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B9D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C06C84;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE5EC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFF5F7;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 宠物爪印 - 左上 -->
  <g transform="translate(60, 60)">
    <!-- 主爪垫 -->
    <ellipse cx="0" cy="8" rx="12" ry="15" fill="white" opacity="0.9"/>
    <!-- 四个小爪垫 -->
    <ellipse cx="-10" cy="-5" rx="6" ry="8" fill="white" opacity="0.9"/>
    <ellipse cx="-3" cy="-8" rx="6" ry="8" fill="white" opacity="0.9"/>
    <ellipse cx="4" cy="-8" rx="6" ry="8" fill="white" opacity="0.9"/>
    <ellipse cx="11" cy="-5" rx="6" ry="8" fill="white" opacity="0.9"/>
  </g>

  <!-- 宠物爪印 - 右下 -->
  <g transform="translate(140, 140) rotate(180)">
    <!-- 主爪垫 -->
    <ellipse cx="0" cy="8" rx="12" ry="15" fill="white" opacity="0.9"/>
    <!-- 四个小爪垫 -->
    <ellipse cx="-10" cy="-5" rx="6" ry="8" fill="white" opacity="0.9"/>
    <ellipse cx="-3" cy="-8" rx="6" ry="8" fill="white" opacity="0.9"/>
    <ellipse cx="4" cy="-8" rx="6" ry="8" fill="white" opacity="0.9"/>
    <ellipse cx="11" cy="-5" rx="6" ry="8" fill="white" opacity="0.9"/>
  </g>

  <!-- 中心文字背景 -->
  <circle cx="100" cy="100" r="45" fill="white" opacity="0.95"/>

  <!-- 公司名称 -->
  <text x="100" y="95" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FF6B9D" text-anchor="middle">宠物</text>
  <text x="100" y="115" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#C06C84" text-anchor="middle">玩具</text>

  <!-- 装饰性小爱心 -->
  <path d="M 100 130 L 95 125 Q 90 120, 95 115 Q 100 110, 100 115 Q 100 110, 105 115 Q 110 120, 105 125 Z" fill="#FF6B9D" opacity="0.6"/>
</svg>
